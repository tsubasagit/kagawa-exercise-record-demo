<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>運動の記録（患者さん用・デモ）</title>
<style>
  :root { --main:#2e8b6e; --main-d:#1f6b54; --bg:#f3f7f5; --ink:#24403a; --sub:#6b7f78; --line:#dfe9e4; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.7 "Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--main); color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:19px; }
  header p { margin:2px 0 0; font-size:12px; opacity:.85; }
  .demo { background:#fff6d6; color:#6b5300; font-size:12px; padding:6px 16px; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:14px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  h2 { font-size:17px; margin:0 0 12px; }
  label { display:block; font-size:14px; color:var(--sub); margin:12px 0 4px; }
  input, select { width:100%; font-size:18px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; min-width:0; }
  button { font-size:17px; border:0; border-radius:10px; padding:12px 16px; cursor:pointer; }
  .primary { width:100%; margin-top:16px; background:var(--main); color:#fff; font-weight:bold; }
  .primary:active { background:var(--main-d); }
  .ghost { background:#eef4f1; color:var(--main-d); font-size:14px; padding:8px 12px; }
  .note { font-size:13px; color:var(--sub); margin:6px 0 0; }
  .kcal { font-size:14px; color:var(--main-d); margin-top:8px; min-height:1.5em; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#24403a; color:#fff; padding:10px 18px; border-radius:20px; font-size:15px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  ul.list { list-style:none; margin:0; padding:0; }
  ul.list li { display:flex; justify-content:space-between; align-items:center; gap:8px; border-top:1px solid var(--line); padding:10px 0; font-size:15px; }
  ul.list li:first-child { border-top:0; }
  .del { background:none; color:#a33; font-size:14px; padding:4px 8px; }
  .empty { color:var(--sub); font-size:14px; }
  .plan-label { font-size:13px; color:var(--sub); margin:0; }
  .plan-goal { font-size:26px; font-weight:bold; color:var(--main-d); margin:0 0 10px; }
  .bar { position:relative; height:16px; background:#e3efe9; border-radius:8px; margin:22px 0 6px; }
  .bar .fill { position:absolute; left:0; top:0; height:16px; background:var(--main); border-radius:8px; }
  .bar .dot { position:absolute; top:-6px; width:28px; height:28px; border-radius:50%; background:var(--main-d); border:4px solid #fff; transform:translateX(-50%); }
  .barlabels { display:flex; justify-content:space-between; font-size:13px; color:var(--sub); }
  .msg { background:#f1f8f5; border-left:5px solid var(--main); border-radius:0 10px 10px 0; padding:10px 14px; margin:14px 0 0; font-size:16px; }
  .extext { font-size:20px; font-weight:bold; margin:2px 0 12px; white-space:pre-wrap; }
  .week { display:flex; gap:6px; }
  .week div { flex:1; text-align:center; border-radius:8px; padding:6px 0; background:#eef4f1; color:var(--sub); font-size:14px; }
  .week div.done { background:var(--main); color:#fff; }
  .week div.future { opacity:.55; }
  .rate { font-size:16px; margin-top:10px; }
  .rate b { font-size:24px; color:var(--main-d); }
  .doctor-note { font-size:12px; color:var(--sub); margin:10px 0 0; }
</style>
</head>
<body>
<header>
  <h1>🏃 運動の記録</h1>
  <p>香川大学 消化器内科　研究用アプリ（デモ）</p>
</header>
<div class="demo">デモ版です。入力はこの端末のブラウザにだけ保存されます。本物の患者さんの情報は入れないでください。</div>

<main>
  <section class="card" id="idCard">
    <h2>研究ID</h2>
    <label for="researchId">受診時にお伝えした研究IDを入力してください（お名前は入力しません）</label>
    <input id="researchId" placeholder="例：K-001" autocomplete="off">
    <label for="weight">体重 kg（消費カロリーの目安を出すときだけ使います・空欄でもOK）</label>
    <input id="weight" type="number" inputmode="decimal" step="0.1" min="20" max="250" placeholder="例：70">
    <button class="ghost" id="saveProfile" style="margin-top:12px">保存する</button>
  </section>

  <section class="card" id="planCard">
    <h2>医師が設定した目標と運動</h2>
    <div id="planBody"></div>
  </section>

  <section class="card">
    <h2>今日の運動を入力</h2>
    <label for="date">日付</label>
    <input id="date" type="date">

    <label for="steps">歩数</label>
    <input id="steps" type="number" inputmode="numeric" min="0" max="100000" placeholder="例：8000">

    <div class="row">
      <div>
        <label for="exercise">運動の種類</label>
        <select id="exercise"></select>
      </div>
      <div>
        <label for="minutes">時間（分）</label>
        <input id="minutes" type="number" inputmode="numeric" min="0" max="600" placeholder="例：30">
      </div>
    </div>
    <div class="kcal" id="kcal"></div>

    <label for="memo">メモ（任意）</label>
    <input id="memo" maxlength="100" placeholder="例：夕方に近所を散歩">

    <button class="primary" id="save">記録する</button>
    <p class="note">歩数だけ、運動だけの入力でも記録できます。</p>
  </section>

  <section class="card">
    <h2>これまでの記録</h2>
    <ul class="list" id="list"></ul>
  </section>
</main>
<div class="toast" id="toast"></div>

<script src="common.js"></script>
<script>
  const $ = id => document.getElementById(id);

  $("exercise").innerHTML = '<option value="">選ばない</option>' +
    EXERCISES.map(e => `<option value="${e.id}">${e.name}</option>`).join("");
  $("date").value = todayStr();

  // patient.html?demo=1 で開くと、架空の研究ID K-001 とデモデータで表示する
  seedIfDemoRequested();
  if (new URLSearchParams(location.search).get("demo") === "1" && !loadProfile().researchId) saveProfile({ researchId: "K-001", weight: "82" });
  const profile = loadProfile();
  $("researchId").value = profile.researchId || "";
  $("weight").value = profile.weight || "";

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
  }

  function updateKcal() {
    const kcal = estimateKcal($("exercise").value, Number($("minutes").value), Number($("weight").value));
    $("kcal").textContent = kcal ? `消費カロリーの目安：約 ${kcal} kcal` : "";
  }
  ["exercise", "minutes", "weight"].forEach(id => $(id).addEventListener("input", updateKcal));

  $("saveProfile").onclick = () => {
    saveProfile({ researchId: $("researchId").value.trim(), weight: $("weight").value });
    toast("保存しました");
    render();
  };

  $("save").onclick = () => {
    const researchId = $("researchId").value.trim();
    if (!researchId) { toast("研究IDを入力してください"); $("researchId").focus(); return; }
    const steps = $("steps").value === "" ? null : Number($("steps").value);
    const exercise = $("exercise").value;
    const minutes = $("minutes").value === "" ? null : Number($("minutes").value);
    if (steps === null && !exercise) { toast("歩数か運動の種類を入力してください"); return; }
    if (exercise && !minutes) { toast("運動の時間（分）を入力してください"); $("minutes").focus(); return; }

    saveProfile({ researchId, weight: $("weight").value });
    const records = loadRecords();
    records.push({
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
      researchId,
      date: $("date").value,
      steps,
      exercise,
      minutes,
      kcal: estimateKcal(exercise, minutes, Number($("weight").value)),
      memo: $("memo").value.trim(),
      createdAt: new Date().toISOString(),
    });
    saveRecords(records);
    ["steps", "minutes", "memo"].forEach(id => $(id).value = "");
    $("exercise").value = "";
    updateKcal();
    toast("記録しました");
    render();
  };

  // 医師が設定した内容は、そのまま表示する。評価の言葉は出さない。
  function renderPlan() {
    const rid = $("researchId").value.trim();
    const plan = rid ? currentPlan(rid) : null;
    if (!rid) { $("planBody").innerHTML = '<p class="empty">研究IDを入力すると、医師が設定した目標が表示されます。</p>'; return; }
    if (!plan) { $("planBody").innerHTML = '<p class="empty">医師が設定した目標は、まだありません。</p>'; return; }
    const g = goalStatus(rid), m = g.metric;
    const wk = weekStatus(rid);
    const pct = Math.round(g.ratio * 100);
    let html = `<p class="plan-label">目標（${escapeHtml(m.label)}）</p><p class="plan-goal">${fmtNum(g.goal)}${m.unit}</p>`;
    if (g.current !== null) {
      html += `<div class="bar"><div class="fill" style="width:${pct}%"></div><div class="dot" style="left:${pct}%"></div></div>
        <div class="barlabels"><span>はじめ ${fmtNum(g.start)}${m.unit}</span><span>いま ${fmtNum(g.current)}${m.unit}</span><span>目標 ${fmtNum(g.goal)}${m.unit}</span></div>`;
    }
    html += `<div class="msg">${escapeHtml(g.message)}</div>`;
    if (g.currentDate) html += `<p class="doctor-note">測定日：${g.currentDate.replaceAll("-", "/")}</p>`;
    html += `<hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
      <p class="plan-label">運動内容</p><p class="extext">${escapeHtml(plan.exerciseText)}</p>
      <div class="week">${wk.days.map(d => `<div class="${d.done ? "done" : ""} ${d.future ? "future" : ""}">${d.label}<br>${d.done ? "✓" : "―"}</div>`).join("")}</div>`;
    if (wk.rate !== null) html += `<div class="rate">今週の達成率　<b>${wk.rate}％</b>　<span class="note">（${wk.done <= wk.target ? `週${wk.target}日のうち${wk.done}日` : `週${wk.target}日の目標に対して${wk.done}日`}）</span></div>`;
    else html += `<div class="rate">今週の実施　<b>${wk.done}日</b></div>`;
    html += `<p class="doctor-note">運動内容を変えられるのは医師だけです。医師が設定を更新すると、この画面が変わります。</p>`;
    $("planBody").innerHTML = html;
  }

  function render() {
    renderPlan();
    const rid = $("researchId").value.trim();
    const mine = loadRecords().filter(r => r.researchId === rid)
      .sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));
    if (!rid) { $("list").innerHTML = '<li class="empty">研究IDを入力すると、記録が表示されます。</li>'; return; }
    if (!mine.length) { $("list").innerHTML = '<li class="empty">まだ記録がありません。</li>'; return; }
    $("list").innerHTML = mine.slice(0, 30).map(r => {
      const parts = [];
      if (r.steps !== null && r.steps !== undefined) parts.push(`${r.steps.toLocaleString()}歩`);
      if (r.exercise) parts.push(`${exerciseName(r.exercise)} ${r.minutes}分`);
      return `<li><span>${escapeHtml(r.date.replaceAll("-", "/"))}　${escapeHtml(parts.join("・"))}</span>
        <button class="del" data-id="${r.id}">消す</button></li>`;
    }).join("");
    $("list").querySelectorAll(".del").forEach(b => b.onclick = () => {
      if (!confirm("この記録を消しますか？")) return;
      saveRecords(loadRecords().filter(r => r.id !== b.dataset.id));
      render();
    });
  }
  $("researchId").addEventListener("change", render);
  render();
</script>
</body>
</html>
