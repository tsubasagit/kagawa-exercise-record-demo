<main>
  <h1>運動記録アプリ（簡易デモ）</h1>
  <a class="box" href="patient.html"><b>① 患者さん用：運動を入力する</b><span>研究IDで入力します。歩数・運動の種類・時間・メモ</span></a>

  <p style="font-size:13px;color:#6b7f78">デモ版のため、記録はこの端末のブラウザにだけ保存されます。本物の患者さんの情報は入れないでください。</p>
